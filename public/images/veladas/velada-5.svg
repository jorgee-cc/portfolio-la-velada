  <circle cx="1230" cy="430" r="352" fill="none" stroke="#ff2d3f" stroke-opacity="0.35" stroke-width="2"/>
  <circle cx="1230" cy="430" r="440" fill="none" stroke="#2f6bff" stroke-opacity="0.14" stroke-width="12"/>
  <circle cx="1230" cy="430" r="520" fill="none" stroke="#f3f1ea" stroke-opacity="0.06" stroke-width="1"/>

