<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e3a5f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="chartGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#22d3ee;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#22d3ee;stop-opacity:0.8" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="450" fill="url(#bgGrad)"/>
  
  <!-- Grid -->
  <g opacity="0.1">
    <line x1="100" y1="100" x2="700" y2="100" stroke="#22d3ee" stroke-width="1"/>
    <line x1="100" y1="150" x2="700" y2="150" stroke="#22d3ee" stroke-width="1"/>
    <line x1="100" y1="200" x2="700" y2="200" stroke="#22d3ee" stroke-width="1"/>
    <line x1="100" y1="250" x2="700" y2="250" stroke="#22d3ee" stroke-width="1"/>
    <line x1="100" y1="300" x2="700" y2="300" stroke="#22d3ee" stroke-width="1"/>
    <line x1="100" y1="350" x2="700" y2="350" stroke="#22d3ee" stroke-width="1"/>
  </g>
  
  <!-- Axes -->
  <line x1="100" y1="350" x2="700" y2="350" stroke="#4ade80" stroke-width="2"/>
  <line x1="100" y1="100" x2="100" y2="350" stroke="#4ade80" stroke-width="2"/>
  
  <!-- Data points -->
  <circle cx="180" cy="280" r="8" fill="#f59e0b" opacity="0.9"/>
  <circle cx="220" cy="260" r="8" fill="#f59e0b" opacity="0.9"/>
  <circle cx="260" cy="240" r="8" fill="#f59e0b" opacity="0.9"/>
  <circle cx="300" cy="220" r="8" fill="#f59e0b" opacity="0.9"/>
  <circle cx="340" cy="200" r="8" fill="#f59e0b" opacity="0.9"/>
  <circle cx="380" cy="180" r="8" fill="#f59e0b" opacity="0.9"/>
  <circle cx="420" cy="160" r="8" fill="#f59e0b" opacity="0.9"/>
  <circle cx="460" cy="150" r="8" fill="#f59e0b" opacity="0.9"/>
  <circle cx="500" cy="140" r="8" fill="#f59e0b" opacity="0.9"/>
  <circle cx="540" cy="130" r="8" fill="#f59e0b" opacity="0.9"/>
  <circle cx="580" cy="120" r="8" fill="#f59e0b" opacity="0.9"/>
  <circle cx="620" cy="110" r="8" fill="#f59e0b" opacity="0.9"/>
  
  <!-- Decision boundary -->
  <path d="M 150 300 Q 300 220, 450 170 T 650 130" stroke="#4ade80" stroke-width="3" fill="none" stroke-dasharray="8,4"/>
  
  <!-- Prediction area -->
  <path d="M 100 300 Q 300 220, 450 170 T 700 130 L 700 100 L 100 100 Z" fill="url(#chartGrad)" opacity="0.2"/>
  
  <!-- Bank icon -->
  <rect x="120" y="50" width="60" height="50" rx="4" fill="#1e293b" stroke="#22d3ee" stroke-width="2"/>
  <text x="150" y="80" font-family="monospace" font-size="16" fill="#22d3ee" text-anchor="middle" font-weight="bold">$</text>
  
  <!-- Model icon -->
  <rect x="620" y="50" width="60" height="50" rx="4" fill="#1e293b" stroke="#4ade80" stroke-width="2"/>
  <text x="650" y="80" font-family="monospace" font-size="14" fill="#4ade80" text-anchor="middle" font-weight="bold">ML</text>
  
  <!-- Title -->
  <text x="400" y="390" font-family="monospace" font-size="20" fill="#e2e8f0" text-anchor="middle" font-weight="bold">Bank Deposit Predictor</text>
  
  <!-- Tech badges -->
  <rect x="200" y="405" width="100" height="30" rx="4" fill="#1e293b" stroke="#22d3ee" stroke-width="1"/>
  <text x="250" y="425" font-family="monospace" font-size="12" fill="#22d3ee" text-anchor="middle">scikit-learn</text>
  
  <rect x="320" y="405" width="100" height="30" rx="4" fill="#1e293b" stroke="#f59e0b" stroke-width="1"/>
  <text x="370" y="425" font-family="monospace" font-size="12" fill="#f59e0b" text-anchor="middle">SVM-RBF</text>
  
  <rect x="440" y="405" width="100" height="30" rx="4" fill="#1e293b" stroke="#4ade80" stroke-width="1"/>
  <text x="490" y="425" font-family="monospace" font-size="12" fill="#4ade80" text-anchor="middle">Streamlit</text>
</svg>
